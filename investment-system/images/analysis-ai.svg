<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4cd7c"/>
      <stop offset="1" stop-color="#d9972a"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e0a63f"/>
    </marker>
    <g id="spark"><path d="M0 -11 L3 -3 L11 0 L3 3 L0 11 L-3 3 L-11 0 L-3 -3 Z" fill="#f0bd5a"/></g>
  </defs>

  <!-- 信息源 -->
  <g>
    <!-- 公众号文章 -->
    <circle cx="86" cy="118" r="40" fill="#7d8fb3"/>
    <rect x="68" y="96" width="36" height="44" rx="5" fill="#fff"/>
    <path d="M75 108h22M75 117h22M75 126h14" stroke="#7d8fb3" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 微信 -->
    <circle cx="200" cy="74" r="40" fill="#2bae67"/>
    <ellipse cx="192" cy="68" rx="18" ry="15" fill="#fff"/>
    <ellipse cx="211" cy="83" rx="15" ry="12.5" fill="#fff" stroke="#2bae67" stroke-width="3"/>
    <circle cx="186" cy="66" r="2.6" fill="#2bae67"/><circle cx="198" cy="66" r="2.6" fill="#2bae67"/>
    <!-- X -->
    <circle cx="320" cy="58" r="40" fill="#1d2433"/>
    <path d="M305 42 L335 74 M335 42 L305 74" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
    <!-- 访谈 / 视频 -->
    <circle cx="440" cy="74" r="40" fill="#e5534b"/>
    <rect x="418" y="58" width="44" height="32" rx="9" fill="#fff"/>
    <path d="M435 66 L449 74 L435 82 Z" fill="#e5534b"/>
    <!-- 知识星球 -->
    <circle cx="554" cy="118" r="40" fill="#e9a23b"/>
    <circle cx="554" cy="118" r="14" fill="#fff"/>
    <ellipse cx="554" cy="118" rx="27" ry="9" fill="none" stroke="#fff" stroke-width="4" transform="rotate(-22 554 118)"/>
  </g>

  <!-- 汇入 AI -->
  <g fill="none" stroke="#e0a63f" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M112 166 Q170 196 238 236"/>
    <path d="M214 124 Q238 176 262 218"/>
    <path d="M320 108 L320 206"/>
    <path d="M426 124 Q402 176 378 218"/>
    <path d="M528 166 Q470 196 402 236"/>
  </g>

  <!-- AI 芯片 -->
  <g>
    <g fill="#c98a12">
      <rect x="262" y="230" width="10" height="20" rx="3"/><rect x="292" y="230" width="10" height="20" rx="3"/><rect x="338" y="230" width="10" height="20" rx="3"/><rect x="368" y="230" width="10" height="20" rx="3"/>
      <rect x="262" y="410" width="10" height="20" rx="3"/><rect x="292" y="410" width="10" height="20" rx="3"/><rect x="338" y="410" width="10" height="20" rx="3"/><rect x="368" y="410" width="10" height="20" rx="3"/>
      <rect x="226" y="282" width="20" height="10" rx="3"/><rect x="226" y="325" width="20" height="10" rx="3"/><rect x="226" y="368" width="20" height="10" rx="3"/>
      <rect x="394" y="282" width="20" height="10" rx="3"/><rect x="394" y="325" width="20" height="10" rx="3"/><rect x="394" y="368" width="20" height="10" rx="3"/>
    </g>
    <rect x="240" y="244" width="160" height="172" rx="30" fill="url(#chip)"/>
    <rect x="258" y="262" width="124" height="136" rx="20" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
    <text x="320" y="356" text-anchor="middle" font-size="66" font-weight="800" fill="#fff" letter-spacing="2">AI</text>
    <use href="#spark" x="436" y="252"/>
    <use href="#spark" x="206" y="406" transform="scale(1)"/>
    <use href="#spark" x="452" y="380" opacity=".7"/>
  </g>

  <!-- 分出三个维度 -->
  <g fill="none" stroke="#e0a63f" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M268 432 Q200 456 156 484"/>
    <path d="M320 440 L320 492"/>
    <path d="M372 432 Q440 456 484 484"/>
  </g>

  <!-- 广度：聚类气泡 -->
  <circle cx="122" cy="566" r="64" fill="#e8b45a"/>
  <g fill="#fff">
    <circle cx="106" cy="552" r="17"/>
    <circle cx="137" cy="545" r="11" opacity=".85"/>
    <circle cx="140" cy="575" r="15" opacity=".95"/>
    <circle cx="110" cy="587" r="9" opacity=".8"/>
    <circle cx="85" cy="574" r="7" opacity=".7"/>
    <circle cx="160" cy="556" r="6" opacity=".7"/>
  </g>
  <text x="122" y="666" text-anchor="middle" font-size="25" font-weight="800" fill="#b57e14">信息广度</text>

  <!-- 维度：多源共识与差异 -->
  <circle cx="320" cy="576" r="64" fill="#2e6bbf"/>
  <g fill="#fff" fill-opacity=".38" stroke="#fff" stroke-width="3.5">
    <circle cx="303" cy="566" r="25"/>
    <circle cx="337" cy="566" r="25"/>
    <circle cx="320" cy="593" r="25"/>
  </g>
  <circle cx="320" cy="575" r="5" fill="#fff"/>
  <text x="320" y="676" text-anchor="middle" font-size="25" font-weight="800" fill="#2e6bbf">信息维度</text>

  <!-- 深度：跟单收益曲线 -->
  <circle cx="518" cy="566" r="64" fill="#15895a"/>
  <path d="M484 532 V598 H554" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3.5" stroke-linecap="round"/>
  <polyline points="490,588 506,574 520,580 536,556 550,540" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff"><circle cx="506" cy="574" r="4.5"/><circle cx="536" cy="556" r="4.5"/><circle cx="550" cy="540" r="5.5"/></g>
  <text x="518" y="666" text-anchor="middle" font-size="25" font-weight="800" fill="#15895a">信息深度</text>
</svg>
